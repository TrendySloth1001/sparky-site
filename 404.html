<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - sparky</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("sparky-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="nf dotted" id="main">
  <div>
    <p class="kicker" style="justify-content:center">Page not found</p>
    <div class="num" aria-hidden="true">404<i></i></div>
    <h1 class="sr">404, page not found</h1>
    <p>That page doesn't exist, or it moved.</p>
    <a class="btn btn-primary" href="/">Back to sparky</a>
  </div>
</main>
</body>
</html>
